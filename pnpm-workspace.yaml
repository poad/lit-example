allowBuilds:
  core-js-bundle: false
  rs-module-lexer: false
  unrs-resolver: false

blockExoticSubdeps: true

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.12.0
  - diff@8.0.3
  - serialize-javascript@7.0.3 || 7.0.5
  - nanoid@3.3.18
  - qs@6.16.0
  - fastq@1.20.3

overrides:
  chokidar: '>=5'
  diff@>=6.0.0 <8.0.3: ^8.0.3
  semver: '>=7'
  serialize-javascript@<=7.0.2: ^7.0.3
  serialize-javascript@>=5.0.0 <7.0.5: ^7.0.5
  tinypool@<2.1.2: ^2.1.2
  ua-parser-js: '>=2'

trustPolicy: no-downgrade
