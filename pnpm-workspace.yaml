allowBuilds:
  core-js-bundle: false
  rs-module-lexer: false
  unrs-resolver: false

blockExoticSubdeps: true

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.19.0
  - '@rolldown/binding-android-arm-eabi@1.3.0'
  - '@rolldown/binding-android-arm64@1.3.0'
  - '@rolldown/binding-darwin-arm64@1.3.0'
  - '@rolldown/binding-darwin-x64@1.3.0'
  - '@rolldown/binding-freebsd-x64@1.3.0'
  - '@rolldown/binding-linux-arm-gnueabihf@1.3.0'
  - '@rolldown/binding-linux-arm64-gnu@1.3.0'
  - '@rolldown/binding-linux-arm64-musl@1.3.0'
  - '@rolldown/binding-linux-ppc64-gnu@1.3.0'
  - '@rolldown/binding-linux-s390x-gnu@1.3.0'
  - '@rolldown/binding-linux-x64-gnu@1.3.0'
  - '@rolldown/binding-linux-x64-musl@1.3.0'
  - '@rolldown/binding-openharmony-arm64@1.3.0'
  - '@rolldown/binding-wasm32-wasi@1.3.0'
  - '@rolldown/binding-win32-arm64-msvc@1.3.0'
  - '@rolldown/binding-win32-x64-msvc@1.3.0'
  - '@web/browser-logs@1.0.1'
  - '@web/config-loader@1.0.1'
  - '@web/dev-server-core@1.0.3'
  - '@web/dev-server-rollup@1.0.1'
  - '@web/dev-server@1.0.1'
  - '@web/parse5-utils@3.0.1'
  - '@web/test-runner-chrome@1.0.2'
  - '@web/test-runner-commands@1.0.2'
  - '@web/test-runner-core@1.0.1'
  - '@web/test-runner-coverage-v8@1.0.1'
  - '@web/test-runner-mocha@1.0.1'
  - '@web/test-runner-playwright@1.0.1'
  - '@web/test-runner@1.0.1'
  - rolldown@1.3.0

overrides:
  chokidar: '>=5'
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'
  ua-parser-js: '>=2'

trustPolicy: no-downgrade
trustPolicyExclude:
  - chromium-bidi
