allowBuilds:
  core-js-bundle: false
  rs-module-lexer: false
  unrs-resolver: false

blockExoticSubdeps: true

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.23.0

overrides:
  chokidar: '>=5'
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'
  ua-parser-js: '>=2'

trustPolicy: no-downgrade
trustPolicyExclude:
  - chromium-bidi
